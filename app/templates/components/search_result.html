{% if found %}
<div class="p-4 bg-blue-50 border border-blue-200 rounded-lg">
    <p class="text-blue-800 font-medium">Archivo encontrado</p>
    <div class="mt-2 space-y-1">
        <p class="text-sm text-blue-600">Nombre: {{ record.original_filename }}</p>
        <p class="text-sm text-blue-600">Fecha: {{ record.upload_date.strftime('%d/%m/%Y %H:%M') }}</p>
        <p class="text-sm text-blue-600">Tamaño: {{ "%.1f"|format(record.file_size / 1024) }} KB</p>
    </div>
    <a
        href="/d/{{ record.codigo }}"
        class="mt-3 inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors"
    >
        Descargar
    </a>
</div>
{% elif query %}
<div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
    <p class="text-yellow-800">No se encontró ningún archivo con el código "{{ query }}"</p>
</div>
{% endif %}
