{% extends "base.html" %}

{% block title %}upSerArch - Inicio{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Buscar Archivo</h2>
        <div class="flex gap-2">
            <input
                type="text"
                name="codigo"
                placeholder="Ingresa el código del archivo"
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/search"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#search-results"
                hx-vals='{"q": event.target.value}'
            >
        </div>
        <div id="search-results" class="mt-4"></div>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Subir Archivo</h2>
        <form
            hx-post="/upload"
            hx-encoding="multipart/form-data"
            hx-target="#upload-result"
            hx-swap="innerHTML"
        >
            <div class="space-y-4">
                <div>
                    <label for="codigo" class="block text-sm font-medium text-gray-700 mb-1">Código del Archivo</label>
                    <input
                        type="text"
                        name="codigo"
                        id="codigo"
                        placeholder="Ej: mi-documento-001"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                <div>
                    <label for="file" class="block text-sm font-medium text-gray-700 mb-1">Archivo PDF</label>
                    <input
                        type="file"
                        name="file"
                        id="file"
                        accept=".pdf"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors"
                >
                    Subir Archivo
                </button>
            </div>
        </form>
        <div id="upload-result" class="mt-4"></div>
    </div>
</div>
{% endblock %}
