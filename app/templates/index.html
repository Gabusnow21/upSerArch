{% extends "base.html" %}

{% block title %}upSerArch - Inicio{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Descargar Archivo</h2>
        <p class="text-gray-500 mb-4">Ingresa el código del archivo para descargarlo</p>
        <div class="flex gap-2">
            <input
                type="text"
                name="codigo"
                placeholder="Código del archivo"
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/search"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#search-results"
                hx-vals='{"q": event.target.value}'
            >
        </div>
        <div id="search-results" class="mt-4"></div>
    </div>
</div>
{% endblock %}
